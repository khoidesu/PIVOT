services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pivot
      POSTGRES_PASSWORD: pivot_dev
      POSTGRES_DB: pivot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pivot -d pivot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
