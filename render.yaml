# Render Blueprint: một web service Docker (API + giao diện). Database ở Neon (Postgres ngoài, free) — KHÔNG tạo DB của Render.
# Dùng: Render Dashboard → New → Blueprint → chọn repo khoidesu/PIVOT. Xem docs/DEPLOY.md và docs/DEPLOY_RENDER_NEON.md.
services:
  - type: web
    name: logection
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # 512 MB là đủ (đo thực tế ~150 MB); gói free "ngủ" sau 15 phút không truy cập → dùng UptimeRobot ping
    region: singapore     # cùng vùng với Neon (AWS Singapore) để giảm độ trễ
    healthCheckPath: /healthz
    autoDeploy: true      # mỗi lần push lên nhánh main sẽ tự build lại
    envVars:
      - key: PIVOT_DATABASE_URL
        sync: false       # dán chuỗi Neon trong Dashboard (không ghi vào repo)
      - key: PIVOT_ADMIN_KEY
        generateValue: true       # Render sinh mã ngẫu nhiên; xem trong Dashboard → Environment
      - key: PIVOT_DATA_MODE
        value: mock
      # --- Nhập liệu tin nhắn / ảnh / PDF scan bằng Gemini (khoá dùng chung cho cả web, chỉ nằm ở máy chủ) ---
      - key: PIVOT_GEMINI_API_KEY
        sync: false       # dán khoá trong Dashboard → Environment (KHÔNG ghi vào repo); trình duyệt không bao giờ nhận được khoá
      - key: PIVOT_INTAKE_EXTRACTOR
        value: hybrid
      - key: PIVOT_GEMINI_VISION_MODEL
        value: gemini-3.5-flash
      - key: PIVOT_GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3.1-flash-lite
      - key: PIVOT_TRUST_PROXY
        value: "true"     # IP thật = phần tử cuối của X-Forwarded-For do proxy Render thêm → giới hạn lượt theo IP đúng người
